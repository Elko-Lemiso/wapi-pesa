name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STATEMENT_PROCESSING_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      NEXT_PUBLIC_PAYMENTS_ENABLED: "false"
      BENCHMARK_CONTRIBUTION_ENABLED: "false"
      EMAIL_DELIVERY_ENABLED: "false"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject private artifacts anywhere in history
        shell: bash
        run: |
          if git rev-list --objects --all | grep -Ei '(^|[ /])(MPESA_Statement[^ ]*\.pdf|statement-extracted\.txt|[^/]+\.(pem|p12|key))$'; then
            echo "A forbidden private artifact is reachable from repository history."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint -- --no-cache
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
